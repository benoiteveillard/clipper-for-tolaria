name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation first, then the change you'd like.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
