<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Clipper for Tolaria – Options</title>
    <meta name="manifest.open_in_tab" content="true" />
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; max-width: 520px; margin: 32px auto; padding: 0 16px; color-scheme: light dark; }
      label { display: block; margin: 12px 0; }
      input[type='text'] { display: block; width: 100%; padding: 6px; font: inherit; box-sizing: border-box; }
      small { color: #888; }
    </style>
  </head>
  <body>
    <h1>Clipper for Tolaria</h1>

    <h2 data-i18n="optionsVault">Vault</h2>
    <p><span data-i18n="optionsFolder">Folder:</span> <strong id="vault-name">none</strong> <small id="vault-permission"></small></p>
    <button id="pick" type="button" data-i18n="optionsPick">Choose the vault folder…</button>

    <h2 data-i18n="optionsNotes">Notes</h2>
    <form id="settings">
      <label><span data-i18n="optionsDefaultType">Default type</span> <input type="text" name="type" /></label>
      <label>
        <span data-i18n="optionsSubfolder">Subfolder</span> <input type="text" name="subfolder" placeholder="(vault root)" data-i18n-placeholder="optionsSubfolderPlaceholder" />
        <small data-i18n="optionsSubfolderHint">Tolaria organizes by type, not by folder: the root is recommended.</small>
      </label>
      <label><input type="checkbox" name="authorAsWikilink" /> <span data-i18n="optionsAuthorWikilink">Author as wikilink</span> (<code>"[[jane-doe]]"</code>)</label>
    </form>
    <p id="error" role="alert" hidden style="color: #d33"></p>
    <p id="saved" role="status" hidden data-i18n="optionsSaved">Saved.</p>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
