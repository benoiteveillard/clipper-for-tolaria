<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clipper for Tolaria</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <p id="status" role="status" data-i18n="statusIdle">Click the extension icon to capture the tab.</p>

      <div id="incoming" role="status" hidden>
        <span><span data-i18n="incomingReady">New clip ready:</span> <strong id="incoming-title"></strong></span>
        <span class="actions">
          <button id="incoming-replace" type="button" data-i18n="incomingReplace">Replace</button>
          <button id="incoming-dismiss" type="button" data-i18n="incomingKeep">Keep my edits</button>
        </span>
      </div>

      <form id="clip" hidden>
        <label><span data-i18n="labelTitle">Title</span> <input id="title" required /></label>
        <label><span data-i18n="labelType">Type</span> <input id="type" /></label>
        <label><span data-i18n="labelContent">Content</span> <textarea id="body" rows="14" spellcheck="false"></textarea></label>

        <p id="duplicate" role="status" hidden><span data-i18n="duplicateLabel">Already clipped:</span> <a id="duplicate-link"></a></p>

        <div class="actions">
          <button id="save" type="submit" class="primary" data-i18n="saveToVault">Save to vault</button>
          <button id="copy" type="button" data-i18n="copy">Copy</button>
          <button id="download" type="button" data-i18n="downloadMd">Download .md</button>
        </div>
        <a id="open" hidden data-i18n="openInTolaria">Open in Tolaria →</a>
      </form>

      <footer>
        <span><span data-i18n="vaultLabel">Vault:</span> <strong id="vault-name">—</strong> <small id="vault-permission"></small></span>
        <span>
          <button id="pick" type="button" data-i18n="choose">Choose…</button>
          <button id="reclip" type="button" data-i18n="recapture">Re-capture</button>
        </span>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
